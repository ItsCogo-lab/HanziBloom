<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover: la app usa toda la pantalla y respeta las franjas del sistema con env(safe-area-inset-*) -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Learn and practice Chinese characters and vocabulary." />
    <meta name="theme-color" content="#fbf8f3" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- Instalar en la pantalla de inicio: manifest (Android, escritorio) y etiquetas de Safari (iPhone) -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="HanziVocab" />
    <title>HanziVocab</title>
    <!--
      Tema claro u oscuro antes de pintar nada, para que no se vea un destello
      del tema equivocado. Lee el ajuste que guarda la app (features/settings)
      y, con «system» o sin ajuste, sigue al dispositivo. Luego la app lo mantiene.
    -->
    <script>
      try {
        var theme = JSON.parse(localStorage.getItem('hanzivocab.settings') || '{}').theme
        if (theme !== 'light' && theme !== 'dark') {
          theme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
        }
        document.documentElement.dataset.theme = theme
      } catch {
        document.documentElement.dataset.theme = 'light'
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
