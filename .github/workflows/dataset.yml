name: Dataset

# Regenerates the dataset from the sources (npm run data:fetch + data:build).
# Needed because some sources (unicode.org, tatoeba.org) are not
# reachable from Claude's cloud environment.
#
# - On a branch other than main: if the result changes, it pushes it to the
#   branch in a separate commit.
# - On main (triggered manually): it only checks that the dataset is up to date.
#
# The full dictionary does not go in this repository: it is kept as an artifact
# ("data-release") and published to HanziDict with the "Publish data" workflow.

on:
  workflow_dispatch:
  push:
    branches-ignore: [main]
    paths:
      - 'scripts/dataset/**'
      - '.github/workflows/dataset.yml'

permissions:
  contents: write

concurrency:
  group: dataset-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run data:fetch
      - run: npm run data:build
      - run: npm run data:validate
      - uses: actions/upload-artifact@v4
        with:
          name: data-release
          path: data-release
      - name: Push the regenerated dataset
        if: github.ref != 'refs/heads/main'
        run: |
          git add src/data public/strokes public/examples docs/DATA_CONFLICTS.md
          if git diff --cached --quiet; then
            echo "The dataset was already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(data): regenerate the dataset from its sources"
          git push
      - name: Check that the main dataset is up to date
        if: github.ref == 'refs/heads/main'
        run: |
          git add -N src/data public/strokes public/examples docs/DATA_CONFLICTS.md
          git diff --exit-code --stat -- src/data public/strokes public/examples docs/DATA_CONFLICTS.md
