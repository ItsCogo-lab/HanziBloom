name: Runtime sources check

# Temporal: prueba la app compilada en un navegador real contra jsDelivr y
# Tatoeba, que no se pueden alcanzar desde el entorno de Claude.

on:
  push:
    branches-ignore: [main]
    paths:
      - '.github/workflows/runtime-sources-check.yml'
      - '.github/runtime-check/**'

jobs:
  data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Repositorio de datos por commit (antes de fusionar)
        run: node .github/runtime-check/data-check.mjs db979cc9d9384f7d0ce43024aa0e3b604633b6a4
      - name: Repositorio de datos en main
        run: node .github/runtime-check/data-check.mjs main

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Tamaño del bundle
        run: ls -l dist/assets && du -sh dist/dictionary dist/strokes dist/examples
      - run: npm install --no-save playwright@1.56.1 && npx playwright install --with-deps chromium
      - name: Navegador contra las fuentes reales
        run: |
          npx vite preview --port 4173 --strictPort &
          npx wait-on -t 30000 http://localhost:4173 2>/dev/null || sleep 5
          node .github/runtime-check/browser-check.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: runtime-*.png
