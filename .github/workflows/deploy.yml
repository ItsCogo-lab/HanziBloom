name: Deploy

# Publishes the app to GitHub Pages (https://itscogo-lab.github.io/VividHanzi/)
# every time main changes. Requires Settings → Pages → Source: GitHub Actions.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# If two pushes arrive in a row, the newest deployment replaces the previous one.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      # The Pages address: https://itscogo-lab.github.io/VividHanzi today, the
      # custom domain once one is set in Settings → Pages (then the base path is empty).
      - id: pages
        uses: actions/configure-pages@v5
      - run: npm run build -- --base=${{ steps.pages.outputs.base_path }}/
        env:
          VITE_SITE_URL: ${{ steps.pages.outputs.base_url }}
      # For search engines: the sitemap lists the home page only, because the
      # other routes are served through 404.html (an HTTP 404 Google won't index).
      # robots.txt only counts at the root of a domain, so it starts to matter
      # with a custom domain.
      - name: Write sitemap.xml and robots.txt
        env:
          SITE_URL: ${{ steps.pages.outputs.base_url }}
        run: |
          cat > dist/sitemap.xml <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">
            <url><loc>$SITE_URL/</loc></url>
          </urlset>
          EOF
          printf 'User-agent: *\nAllow: /\n\nSitemap: %s/sitemap.xml\n' "$SITE_URL" > dist/robots.txt
      # GitHub Pages knows nothing about React routes: reloading /study responds with
      # 404.html, so that file is a copy of the app and the router does the rest.
      - run: cp dist/index.html dist/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
