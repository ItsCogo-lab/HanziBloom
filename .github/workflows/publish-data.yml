name: Publish data

# Regenerates the full dictionary from its sources and publishes it as a
# new version in ItsCogo-lab/HanziDict, where the app reads it from via
# jsDelivr. The app does not change and is not rebuilt.
#
# Needs the DATA_REPO_TOKEN secret: a (fine-grained) GitHub token with
# "Contents: Read and write" permission on ItsCogo-lab/HanziDict only.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'New data version, greater than the published one (e.g. 1.1.0)'
        required: true

concurrency:
  group: publish-data
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run data:fetch
      - run: npm run data:build
      - run: npm run data:validate
      - uses: actions/checkout@v4
        with:
          repository: ItsCogo-lab/HanziDict
          token: ${{ secrets.DATA_REPO_TOKEN }}
          path: data-repo
      - name: Prepare the version
        env:
          VERSION: ${{ inputs.version }}
        run: npm run data:release -- "$VERSION" data-repo
      - name: Publish
        env:
          VERSION: ${{ inputs.version }}
        working-directory: data-repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Publish the full dictionary, version $VERSION"
          git push
      - name: Notify jsDelivr of the new manifest
        # Without this, jsDelivr may serve the previous manifest for up to 12 hours
        run: curl -sSf "https://purge.jsdelivr.net/gh/ItsCogo-lab/HanziDict@main/v1/manifest.json"
